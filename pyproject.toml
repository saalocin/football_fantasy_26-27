[project]
name = "fpl-optimizer"
version = "0.1.0"
description = "Data-driven Fantasy Premier League optimizer. Medallion architecture; bronze layer only so far."
requires-python = ">=3.13"
dependencies = [
    # Bronze needs exactly one thing: a way to fetch bytes politely.
    # pandas / numpy / PuLP arrive with silver and the optimizer, not before.
    "httpx>=0.28",
]

[project.scripts]
fpl-fetch = "fpl.fetch_fpl:main"
fpl-qa = "fpl.qa:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # flake8-simplify
]

[tool.pytest.ini_options]
# The scope is DECLARED, not globbed off the disk. A bare `pytest` walks
# everything it can reach, and this repo will grow worktrees and caches that
# contain their own copies of these tests. diadoche once reported 226 tests in
# 20 files where the working tree held 113 in 10.
testpaths = ["tests"]
addopts = "-q"
